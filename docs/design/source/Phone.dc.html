<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Trip workspace phone</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="hf.css">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Nunito:wght@700;800&amp;family=Noto+Sans+TC:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.ph-app{width:390px;height:844px}
.ph-top{height:52px;flex:none;display:flex;align-items:center;padding:0 4px 0 12px;gap:2px;background:var(--surface);border-bottom:1px solid var(--border)}
.ph-top .title{flex:1;padding:0 6px;height:44px}
.ph-seg{margin:8px 16px;display:flex;flex:none}
.ph-seg button{flex:1;justify-content:center;height:36px}
.ph-tabs{height:52px;flex:none;display:flex;gap:6px;padding:0 16px 8px;align-items:stretch;overflow:hidden}
.ph-tab{flex:none;width:62px;border:1px solid var(--border2);border-radius:var(--r-md);background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.2;font-weight:700}
.ph-tab small{font-size:11px;color:var(--muted);font-weight:500}
.ph-tab.on{background:var(--pri-strong);color:var(--onpri);border-color:var(--pri-strong)}
.ph-tab.on small{color:rgba(255,255,255,.85)}
.ph-drow{height:44px;flex:none;display:flex;align-items:center;gap:8px;padding:0 4px 0 16px;border-top:1px solid var(--border);background:var(--surface)}
.ph-vp{flex:1;position:relative;overflow:hidden;min-height:0;background:var(--axisbg)}
.ph-axis{position:absolute;left:46px;right:0;top:10px;height:540px;background-image:linear-gradient(to bottom,var(--grid) 1px,transparent 1px),linear-gradient(to bottom,var(--grid2) 1px,transparent 1px);background-size:100% 44px,100% 44px;background-position:0 0,0 22px}
.ph-axis .ev{left:4px;right:10px;padding-top:4px;padding-bottom:4px}
.ph-axis .ev.warn{padding-top:3px;padding-bottom:3px}
.ph-axis .ev::before{top:6px;bottom:6px}
.ph-axis .ev.half-l{right:auto;width:calc(50% - 8px)}
.ph-axis .ev.half-r{left:auto;width:calc(50% - 8px)}
.ph-axis .leg{left:24px;right:30px}
.ph-axis .ghost{left:4px;right:10px;height:32px;align-items:center}
.ph-vp .gut{position:absolute;left:0;top:10px;width:42px}
.ph-vp .gut span{right:4px}
.ph-dock{height:60px;flex:none;border-top:1px solid var(--border);background:var(--surface);display:flex;position:relative;border-radius:16px 16px 0 0;box-shadow:0 -4px 14px rgba(22,34,59,.08)}
.ph-dock button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding-top:8px;min-height:44px}
.ph-dock .grab{position:absolute;top:6px;left:50%;width:36px;height:4px;margin-left:-18px;border-radius:2px;background:var(--border2)}
</style>
</helmet>
<div class="hf app ph-app">

<header class="ph-top">
  <button class="title" aria-haspopup="true" aria-label="Trips: Kyoto &amp; Osaka">Kyoto &amp; Osaka<svg class="i" style="color:var(--muted)" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></button>
  <button class="ib lg" aria-label="Notes"><svg class="i" style="width:20px;height:20px" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h14v12l-4 4H5z"></path><path d="M15 20v-4h4M8 9h8M8 13h4"></path></svg></button>
  <button class="ib lg" aria-label="Share"><svg class="i" style="width:20px;height:20px" viewBox="0 0 24 24" aria-hidden="true"><circle cx="6" cy="12" r="2.5"></circle><circle cx="18" cy="6" r="2.5"></circle><circle cx="18" cy="18" r="2.5"></circle><path d="M8.2 11l7.6-4M8.2 13l7.6 4"></path></svg></button>
  <button class="ib lg" aria-label="More: Export, language, Trip settings"><svg class="i" style="width:20px;height:20px" viewBox="0 0 24 24" fill="currentColor" stroke="none" aria-hidden="true"><circle cx="5" cy="12" r="1.6"></circle><circle cx="12" cy="12" r="1.6"></circle><circle cx="19" cy="12" r="1.6"></circle></svg></button>
</header>

<div class="seg ph-seg">
  <button class="on"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="17" rx="2"></rect><path d="M3 10h18M8 2v4M16 2v4"></path></svg>Schedule</button>
  <button><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4L3 6v14l6-2 6 2 6-2V4l-6 2z"></path><path d="M9 4v14M15 6v14"></path></svg>Map</button>
</div>

<nav class="ph-tabs" aria-label="Days">
  <button class="ph-tab">Day 1<small>3 Nov</small></button>
  <button class="ph-tab on">Day 2<small>4 Nov</small></button>
  <button class="ph-tab">Day 3<small>5 Nov</small></button>
  <button class="ph-tab">Day 4<small>6 Nov</small></button>
  <button class="ph-tab" style="width:44px" aria-label="Add Day"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></button>
</nav>

<div class="ph-drow"><h3 class="ty-h3" style="margin:0">Day 2</h3><span class="muted">Wed 4 Nov</span><span style="flex:1"></span><button class="ib lg" aria-label="Day 2 menu"><svg class="i" style="width:20px;height:20px" viewBox="0 0 24 24" fill="currentColor" stroke="none" aria-hidden="true"><circle cx="5" cy="12" r="1.6"></circle><circle cx="12" cy="12" r="1.6"></circle><circle cx="19" cy="12" r="1.6"></circle></svg></button></div>

<div class="ban k-l" style="height:32px"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 19V6"></path><path d="M3 14h18v5"></path><path d="M21 14v-2a3 3 0 0 0-3-3h-7v5"></path></svg><b>Hotel Granvia Kyoto</b><span class="muted">· night 2 of 3</span></div>

<div class="ph-vp">
  <div class="gut" aria-hidden="true">
    <span style="top:0px">08:00</span><span style="top:44px">09:00</span><span style="top:88px">10:00</span><span style="top:132px">11:00</span><span style="top:176px">12:00</span><span style="top:220px">13:00</span><span style="top:264px">14:00</span><span style="top:308px">15:00</span><span style="top:352px">16:00</span><span style="top:396px">17:00</span><span style="top:440px">18:00</span><span style="top:484px">19:00</span><span style="top:528px">20:00</span>
  </div>
  <div class="ph-axis">
    <button class="ev k-a" style="top:22px;height:66px"><span class="t"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 21V4"></path><path d="M5 4h12l-2 4 2 4H5"></path></svg><span>Arashiyama Bamboo Grove</span></span><span class="s">08:30 – 10:00</span><span class="s">Sagano, Kyoto</span></button>
    <button class="leg" style="top:88px"><svg class="i" style="width:12px;height:12px" viewBox="0 0 24 24" aria-hidden="true"><circle cx="13" cy="4" r="2"></circle><path d="M12 8l-3 5 3 3v5M12 8l4 3 2 1M9 13l-3 1"></path></svg>Walk · 20 min</button>
    <button class="ev k-a" style="top:110px;height:44px"><span class="t"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 21V4"></path><path d="M5 4h12l-2 4 2 4H5"></path></svg><span>Tenryu-ji</span></span><span class="s">10:30 – 11:30</span></button>
    <button class="ev k-m" style="top:176px;height:44px"><span class="t"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3v8M5 3v5a2 2 0 0 0 4 0V3M7 11v10M17 3c-2 2-2 6 0 8v10"></path></svg><span>Tofu lunch</span></span><span class="s">12:00 – 13:00</span></button>
    <button class="ev k-a half-l" style="top:264px;height:66px"><span class="t"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 21V4"></path><path d="M5 4h12l-2 4 2 4H5"></path></svg><span>Kinkaku-ji</span></span><span class="s">14:00 – 15:30</span></button>
    <button class="ev k-a half-r" style="top:286px;height:66px"><span class="t"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 21V4"></path><path d="M5 4h12l-2 4 2 4H5"></path></svg><span>Tea ceremony</span></span><span class="s">14:30 – 16:00</span></button>
    <button class="ghost" style="top:352px"><svg class="i" style="width:14px;height:14px" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>Tap to add · 16:00</button>
    <button class="ev k-m xs" style="top:396px;height:28px"><span class="t"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3v8M5 3v5a2 2 0 0 0 4 0V3M7 11v10M17 3c-2 2-2 6 0 8v10"></path></svg><span>Konbini stop</span></span></button>
    <button class="ev k-m warn" style="top:462px;height:66px"><span class="t"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3v8M5 3v5a2 2 0 0 0 4 0V3M7 11v10M17 3c-2 2-2 6 0 8v10"></path></svg><span>Nishiki Market grazing</span></span><span class="s">18:30 – 20:00</span><span class="wmsg"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l10 18H2z"></path><path d="M12 10v5"></path><path d="M12 18v.01"></path></svg>Opening hours may conflict</span></button>
  </div>
</div>

<nav class="ph-dock" aria-label="Backlog, Archive and Todos">
  <span class="grab"></span>
  <button><span style="display:flex;gap:6px;align-items:center;font-weight:700">Backlog <span class="cnt">4</span></span><span class="muted" style="font-size:11px">Swipe up</span></button>
  <button><span style="display:flex;gap:6px;align-items:center;font-weight:700">Archive <span class="cnt">2</span></span><span class="muted" style="font-size:11px">Swipe up</span></button>
  <button><span style="display:flex;gap:6px;align-items:center;font-weight:700">Todos <span class="cnt">5</span></span><span class="muted" style="font-size:11px">Swipe up</span></button>
</nav>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
