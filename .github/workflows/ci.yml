name: CI

on:
  push:
    branches: [main]
  pull_request:

# The token can only read the repository; nothing here needs more.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: travel
          POSTGRES_PASSWORD: travel
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U travel"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      # Actions are pinned to a commit (the tag is in the comment), so a moved tag cannot change what runs.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Fails on a known high-severity advisory in what production runs (dev tools are not checked here).
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
