# fly.io (step 27). Deploy with `fly deploy --ha=false`: one Machine only, because the live
# collaboration rooms (live.ts) live in the API's memory and migrations run when the API starts.
app = "ideal-travel-planner"
# Singapore, beside the Neon database (aws-ap-southeast-1); every query crosses this distance.
primary_region = "sin"

[build]
  # Built into the page and seen by every browser, so not secrets. The Dockerfile refuses to build
  # without the three Auth0 values.
  [build.args]
    # The production SPA application and API in the Auth0 tenant (the tenant is shared with development).
    VITE_AUTH0_DOMAIN = "dev-3iemd6gpjr2ff863.us.auth0.com"
    VITE_AUTH0_CLIENT_ID = "DAuNX4KzjlojJkJCgv239z5YwNfuAftX"
    # The API's Identifier; the AUTH0_AUDIENCE secret has the same value.
    VITE_AUTH0_AUDIENCE = "https://travel-planner-api-prod"
    # VITE_GOOGLE_MAPS_API_KEY = ""
    # VITE_GOOGLE_MAP_ID = ""

# Not secret. The secrets (DATABASE_URL, DATABASE_URL_UNPOOLED, AUTH0_M2M_CLIENT_ID,
# AUTH0_M2M_CLIENT_SECRET, GOOGLE_MAPS_API_KEY, OPENAI_API_KEY) are set with `fly secrets`. NODE_ENV is
# set in the Dockerfile. Never set AUTH_FAKE.
[env]
  APP_ORIGIN = "https://ideal-travel-planner.fly.dev"
  # The same tenant and API as the VITE_ build values above.
  AUTH0_DOMAIN = "dev-3iemd6gpjr2ff863.us.auth0.com"
  AUTH0_AUDIENCE = "https://travel-planner-api-prod"
  # One proxy (Fly's) in front: the usage limits count by the address it reports (step 33).
  TRUST_PROXY = "1"

[http_service]
  internal_port = 8080
  force_https = true
  # Idle for a few minutes, the Machine is suspended and wakes on the next request (faster than a
  # stop). An open live connection counts as traffic, so collaboration keeps it awake.
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [[http_service.checks]]
    # The API starts listening only after the migrations, so give the first start some time.
    grace_period = "30s"
    interval = "30s"
    timeout = "5s"
    method = "GET"
    path = "/api/health"

[[vm]]
  # Image uploads are decoded by sharp (up to 5 MB each), which needs room beyond Node's own.
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
